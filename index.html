<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Barbearia Copa Rio</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Conceito: agenda de balcão. Cabeçalho preto com as listras da logo, linhas grandes de horário
   que se leem de relance, e um botão central para falar ou digitar o comando. */
:root{
  --bg:#EEEEEC; --surface:#FFFFFF; --ink:#0A0A0A; --on-ink:#FFFFFF;
  --muted:#5A5A57; --line:#D4D4D0; --signal:#B3261E;
  --head-bg:#000000; --head-fg:#FFFFFF; --head-signal:#FF8F85;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0B; --surface:#171717; --ink:#F4F4F2; --on-ink:#0A0A0A;
    --muted:#A4A4A0; --line:#2D2D2D; --signal:#FF8F85; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#171717; --ink:#F4F4F2; --on-ink:#0A0A0A;
  --muted:#A4A4A0; --line:#2D2D2D; --signal:#FF8F85; color-scheme:dark;
}
*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-bg);z-index:30}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top :focus-visible{outline-color:var(--head-fg)}
[hidden]{display:none!important}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-fg)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top img{width:40px;height:46px;object-fit:contain;flex:none}
.brand{font:700 1.75rem/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;text-wrap:balance}
.top::after{content:"";display:block;height:12px;
  background:
   linear-gradient(var(--head-fg),var(--head-fg)) 0 0/100% 1px no-repeat,
   linear-gradient(var(--head-fg),var(--head-fg)) 0 4px/100% 2px no-repeat,
   linear-gradient(var(--head-fg),var(--head-fg)) 0 9px/100% 3px no-repeat}

/* ajuda / tutorial */
.help{margin-left:auto;flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--head-fg);background:transparent;color:var(--head-fg);font:700 1.5rem/1 var(--f-display)}
.tut-list{display:grid;gap:8px}
details.tut{border:1px solid var(--line);border-radius:6px;background:var(--bg)}
details.tut summary{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 14px;cursor:pointer;list-style:none;font:700 1.2rem/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
details.tut summary::-webkit-details-marker{display:none}
details.tut summary::after{content:"+";margin-left:auto;font:600 1.6rem/1 var(--f-display)}
details.tut[open] summary::after{content:"\2013"}
details.tut[open] summary{border-bottom:1px solid var(--line)}
.tut-b{padding:6px 14px 14px}
.tut-b p,.tut-b li{margin:8px 0;font-size:1rem;line-height:1.45}
.tut-b ol,.tut-b ul{margin:6px 0;padding-left:1.3rem}
.tut-b .ex{list-style:none;padding:0}
.tut-b .ex li{padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tut-note{margin:10px 0 0;padding:10px 12px;border-left:4px solid var(--ink);background:var(--surface);font-size:.95rem}

/* situação do salvamento */
.sv-row{max-width:640px;margin:0 auto;padding-bottom:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sv{display:inline-flex;align-items:center;gap:7px;font:600 .74rem/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.sv::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.sv.err{color:var(--head-signal)}
.sv.busy::before{animation:pulse2 .9s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.25}}

/* página */
main{max-width:640px;margin:0 auto;padding-block:14px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--muted);border-radius:6px;padding:9px 12px;margin-bottom:12px;font-size:.92rem;color:var(--muted)}
.note button{background:none;border:0;padding:6px 0;font-weight:600;text-decoration:underline;color:var(--ink)}
.eyebrow{margin:0;font:600 .8rem/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* semana */
.wk{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.wk .lbl{flex:1;font:600 1.15rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.ib{position:relative;display:inline-grid;place-items:center;width:46px;height:46px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.ib input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ib.txt{width:auto;padding:0 12px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;min-height:68px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.dchip .dw{font:600 .72rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dchip .dn{font:700 1.7rem/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.dchip .dc{font:600 .8rem/1 var(--f-body);color:var(--muted)}
.dchip.today .dn{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.dchip.closed{background:transparent;border-style:dashed;opacity:.65}
.dchip.sel{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.dchip.sel .dw,.dchip.sel .dc{color:var(--on-ink);opacity:.8}

.dayh{margin:0;font:700 2.2rem/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.sum{margin:6px 0 14px;color:var(--muted);font-variant-numeric:tabular-nums}
.sum b{color:var(--ink)}

/* horários */
.slots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.slot{display:grid;grid-template-columns:4rem 1fr auto;align-items:center;gap:10px;width:100%;min-height:58px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);text-align:left}
.slot .t{font:600 1.55rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.slot .n{min-width:0;overflow-wrap:anywhere}
.slot.free .n{color:var(--muted)}
.slot.booked{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.slot.booked .n{font-weight:600;font-size:1.18rem}
.slot small{margin-left:8px;font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.slot.past{opacity:.5}
.slot.now{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.slot .r{display:inline-flex}
.agora{font:600 .68rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:3px 5px;margin-left:8px;vertical-align:middle}
.lunch{display:grid;place-items:center;min-height:44px;color:var(--muted);font:600 .95rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;
  background:repeating-linear-gradient(180deg,var(--line) 0 2px,transparent 2px 6px)}
.lunch span{background:var(--bg);padding:4px 12px}
.closed-card{border:1px dashed var(--muted);border-radius:6px;padding:22px 16px;text-align:center;color:var(--muted)}
.flash{animation:flash 1.4s ease-out 1}
@keyframes flash{from{box-shadow:0 0 0 6px var(--ink)}to{box-shadow:0 0 0 0 transparent}}

/* clientes */
.crow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;width:100%;min-height:62px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);text-align:left}
.ctxt{display:grid;gap:2px;min-width:0}
.cn{font:700 1.45rem/1.05 var(--f-display);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.cn small{margin-left:8px;font:500 .7rem/1 var(--f-body);letter-spacing:.08em;opacity:.6}
.cs{font-size:.9rem;color:var(--muted)}
.cc{font:600 1.3rem/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:1.4rem;text-align:right}
.search{margin-bottom:12px}
.search .btn{width:auto;white-space:nowrap}
.banner{border:2px solid var(--ink);border-style:solid;color:var(--ink);font-weight:600}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr;align-items:end;gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;background:none;border:0;color:var(--muted);font:600 .8rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.tab[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.fabw{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 .8rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.fab{width:68px;height:68px;margin-top:-30px;border-radius:50%;border:5px solid var(--surface);background:var(--ink);color:var(--on-ink);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.fab svg{width:30px;height:30px}
.fab .i-kb{display:none}
.nodict .fab .i-mic{display:none}
.nodict .fab .i-kb{display:block}
.fab.on,.mic.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--ink) 25%,transparent)}}

/* janelas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;max-height:92vh;max-height:92dvh;overflow:auto;
  background:var(--surface);color:var(--ink);border-radius:14px 14px 0 0;
  padding-top:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-h h2{margin:2px 0 0;font:700 2rem/1.05 var(--f-display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.x{flex:none;width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.stack{display:grid;gap:12px}
label{display:block;margin-bottom:5px;font-weight:600;font-size:.95rem}
.field{display:flex;gap:8px}
input[type=text],input[type=tel],input[type=date],textarea{width:100%;min-height:54px;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:18px}
textarea{resize:none;line-height:1.3}
input:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 2px var(--ink)}
.mic{flex:none;width:54px;min-height:54px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface)}
.mic.on{background:var(--ink);color:var(--on-ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:10px 16px;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface);color:var(--ink);font-size:1.08rem;font-weight:600;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.danger{border-color:var(--signal);color:var(--signal)}
.btn.danger.solid{background:var(--signal);color:var(--on-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.live{min-height:1.3em;margin:0;color:var(--muted);font-style:italic}
.hint{margin:0;color:var(--muted);font-size:.95rem}
.tip-keys{display:none}
.nodict .tip-keys{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums}
.chip.soft{border-color:var(--line);font-weight:500}
.chip[disabled]{opacity:.4}
.msg{padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.msg.err{border-color:var(--signal);color:var(--signal)}
.preview{border:2px solid var(--ink);border-radius:6px;padding:14px;display:grid;gap:10px}
.preview.danger{border-color:var(--signal)}
.preview .big{margin:0;font:700 1.7rem/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.preview .when{margin:0;font-size:1.1rem;font-variant-numeric:tabular-nums}
.detail{display:grid;gap:4px;margin-bottom:14px}
.detail .nm{font:700 2.1rem/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.detail .wh{font-size:1.2rem;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 96px);z-index:60;width:max-content;max-width:calc(100vw - 32px);
  display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:6px;background:var(--ink);color:var(--on-ink);font-weight:500;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.toast button{background:none;border:0;padding:6px 2px;color:inherit;font-weight:700;text-decoration:underline}

/* painel */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;margin-bottom:10px}
.seg button{min-height:48px;border:0;background:var(--surface);font:600 1.05rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 20px}
.tile{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:12px 10px}
.tile .v{display:block;font:700 2.7rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile .k{display:block;margin-top:4px;font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec{margin:22px 0 8px;font:700 1.3rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.insight{margin:0 0 12px;padding:10px 12px;border-left:4px solid var(--ink);background:var(--surface)}
.insight p{margin:2px 0}
.bars{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:3rem 1fr 3.4rem;gap:10px;align-items:center;min-height:38px}
.brow .l{font:600 1.25rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.brow .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.track{position:relative;height:24px;border:1px solid var(--line);border-radius:3px;background:var(--surface);overflow:hidden}
.fill{display:block;height:100%;background:var(--ink)}
.brow.low .track{background:repeating-linear-gradient(180deg,var(--line) 0 2px,transparent 2px 5px)}
.tag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:600 .66rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:3px 5px;border-radius:3px;background:var(--bg);color:var(--ink);border:1px solid var(--ink)}
.empty{border:1px dashed var(--muted);border-radius:6px;padding:26px 16px;text-align:center;color:var(--muted)}
.legend{margin:8px 0 0;font-size:.85rem;color:var(--muted)}

@media (max-width:380px){.brand{font-size:1.45rem}.tile .v{font-size:2.3rem}.slot{grid-template-columns:3.6rem 1fr auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(() => {
'use strict';

/*PURE-START*/
// Configuração da barbearia: mude aqui se o horário mudar.
const CFG = { open: 10, close: 20, step: 20, lunch: [12, 14], openDays: [0, 1, 2, 3, 4, 5, 6] };
const DOW = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DOW3 = ['dom','seg','ter','qua','qui','sex','sáb'];
const MON = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MON3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const pad = n => String(n).padStart(2, '0');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromStr = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = fromStr(s); d.setDate(d.getDate() + n); return toStr(d); };
const dowOf = s => fromStr(s).getDay();
const hhmm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const todayStr = () => toStr(new Date());
const nowMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const isOpenDay = s => CFG.openDays.includes(dowOf(s));
const idOf = (d, t) => `${d}_${t.replace(':', '')}`;
const labelDay = s => { const d = fromStr(s); return `${DOW3[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const longDay = s => { const d = fromStr(s); return `${cap(DOW[d.getDay()])}, ${d.getDate()} de ${MON[d.getMonth()]}`; };
const weekOf = s => { const start = addDays(s, -((dowOf(s) + 6) % 7)); return Array.from({ length: 7 }, (_, i) => addDays(start, i)); };
const monthDates = s => { const d = fromStr(s), y = d.getFullYear(), m = d.getMonth(); const n = new Date(y, m + 1, 0).getDate(); return Array.from({ length: n }, (_, i) => `${y}-${pad(m + 1)}-${pad(i + 1)}`); };

const SLOTS = [];
for (let m = CFG.open * 60; m < CFG.close * 60; m += CFG.step) {
  if (m >= CFG.lunch[0] * 60 && m < CFG.lunch[1] * 60) continue;
  SLOTS.push(hhmm(m));
}
const SLOT_SET = new Set(SLOTS);
const HOURS = [...new Set(SLOTS.map(t => +t.slice(0, 2)))];
const slotsInHour = h => SLOTS.filter(t => +t.slice(0, 2) === h).length;

const S = {
  tab: 'agenda', date: todayStr(), range: 'day', appts: new Map(),
  mode: 'boot', readOnly: false, stale: false,
  dict: null, dictState: 'idle', dictTarget: null,
  pending: null, choices: [], flash: null, undo: null,
  contacts: new Map(), cq: '', bookFor: null,
  saving: false, saveErr: false, lastSave: null,
  lastBackup: null, persisted: false, updated: false, pendingRestore: null
};
const apptsOn = d => [...S.appts.values()].filter(a => a.date === d).sort((a, b) => a.time.localeCompare(b.time));
// Agendamentos futuros com o mesmo nome (sem acento e sem diferenciar maiúsculas)
const dupAppts = name => {
  const k = fold(name).replace(/\s+/g, ' ').trim(); if (!k) return [];
  const today = todayStr();
  return [...S.appts.values()].filter(a => a.date >= today && fold(a.name).replace(/\s+/g, ' ').trim() === k)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
};
const dupText = (name, list) => `${name} já tem horário marcado: ${list.slice(0, 3).map(a => `${labelDay(a.date)} ${a.time}`).join(', ')}${list.length > 3 ? '…' : ''}. Agendar mais um?`;

// ---------- clientes (contatos) ----------
const nkey = s => fold(s).replace(/\s+/g, ' ').trim();
const slugId = name => 'c_' + (nkey(name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || Date.now().toString(36));
// Contatos salvos + nomes que já aparecem na agenda (menos os exemplos)
function allContacts() {
  const m = new Map(), hidden = new Set();
  S.contacts.forEach(c => { const k = nkey(c.name); if (!k) return; if (c.hidden) hidden.add(k); else m.set(k, { id: c.id, name: c.name, tel: c.tel || '', ex: !!c.ex, saved: true, key: k }); });
  S.appts.forEach(a => {
    if (a.ex) return;
    const k = nkey(a.name); if (!k || hidden.has(k)) return;
    const cur = m.get(k);
    if (!cur) m.set(k, { id: slugId(a.name), name: a.name, tel: a.tel || '', ex: false, saved: false, key: k });
    else if (!cur.tel && a.tel) cur.tel = a.tel;
  });
  return [...m.values()].sort((a, b) => a.key.localeCompare(b.key, 'pt'));
}
function contactStats(key) {
  const today = todayStr(); let done = 0, last = null; const next = [];
  S.appts.forEach(a => {
    if (nkey(a.name) !== key) return;
    if (a.date < today) { done++; if (!last || a.date > last) last = a.date; } else next.push(a);
  });
  next.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  return { done, last, next };
}
// "Pedro" encontra "Pedro", "Pedro Silva" e "Maria Pedro"
function matchContacts(key) {
  if (!key) return [];
  return allContacts().filter(c => c.key === key || c.key.startsWith(key + ' ') || c.key.split(' ').includes(key))
    .sort((a, b) => (b.key === key) - (a.key === key) || a.key.localeCompare(b.key, 'pt'));
}

// ---------- texto → intenção ----------
const fold = s => { let o = ''; for (let i = 0; i < s.length; i++) { const b = s[i].normalize('NFD')[0].toLowerCase(); o += /[a-z0-9:\/]/.test(b) ? b : ' '; } return o; };
const VERBS = {
  create: ['agendar','agenda','agende','marcar','marca','marque','cadastrar','cadastra','anotar','anota','incluir','inclui'],
  cancel: ['cancelar','cancela','cancele','desmarcar','desmarca','desmarque','remover','remove','apagar','apaga','excluir','exclui'],
  move:   ['mudar','muda','mude','remarcar','remarca','remarque','trocar','troca','troque','alterar','altera','passar','passa','adiar','adia','antecipar','antecipa','transferir','transfere'],
  view:   ['ver','abrir','abre','mostrar','mostra']
};
const VERB_RE = new RegExp('\\b(' + Object.values(VERBS).flat().join('|') + ')\\b');

  let txt, cls = 'sv';
  if (S.saveErr) { txt = 'Não foi possível salvar. Tente de novo'; cls += ' err'; }
  else if (S.saving) { txt = 'Salvando…'; cls += ' busy'; }
  else if (S.lastSave) txt = `Salvo ${where} · ${fmtSave(S.lastSave)}`;
  else txt = 'Nenhuma alteração salva ainda';
  if (el.textContent !== txt) el.textContent = txt;
  el.className = cls;
}
// Registra a hora do último salvamento.
async function markSaved() {
  const at = Date.now(); S.lastSave = at;
  try { localStorage.setItem(LS_L, String(at)); } catch (e) { /* o dado em si já foi salvo */ }
}

// ---------- ações ----------
const ctx = {
  async doCreate({ name, date, time, tel }) {
    const id = idOf(date, time);
    if (S.appts.has(id)) throw new Error(`${labelDay(date)} às ${time} já está ocupado.`);
    await store.put({ id, name, date, time, tel });
    try { await ensureContact(name, tel); } catch (e) { /* o corte já foi salvo */ }
    return { date, flashId: id, msg: `Agendado · ${name} · ${labelDay(date)} ${time}`, undo: () => store.remove(id) };
  },
  async doCancel(a) {
    await store.remove(a.id);
    return { date: a.date, msg: `Cancelado · ${a.name} · ${labelDay(a.date)} ${a.time}`, undo: () => store.put(a) };
  },
  async doMove(a, date, time) {
    const id = idOf(date, time);
    if (id !== a.id && S.appts.has(id)) throw new Error(`${labelDay(date)} às ${time} já está ocupado.`);
    await store.put({ ...a, id, date, time });
    if (id !== a.id) await store.remove(a.id);
    return { date, flashId: id, msg: `Remarcado · ${a.name} · ${labelDay(date)} ${time}`, undo: async () => { await store.put(a); if (id !== a.id) await store.remove(id); } };
  }
};
async function run(fn) {
  S.saving = true; paintSave();
  try { const r = (await fn()) || true; S.saveErr = false; await markSaved(); S.saving = false; paintSave(); return r; }
  catch (e) {
    S.saving = false; S.saveErr = true; paintSave();
    if (e && e.name === 'QuotaExceededError') toast('O armazenamento do aparelho está cheio. Baixe um backup e apague agendamentos antigos.');
    else toast(e && e.name === 'Error' && e.message ? e.message : 'Não foi possível salvar neste aparelho. Baixe um backup agora.');
    return false;
  }
}
function after(r) {
  if (r && r.date) S.date = r.date;
  S.tab = 'agenda'; S.flash = r && r.flashId || null; render();
  if (r && r.msg) toast(r.msg, r.undo);
  const f = document.querySelector('.flash'); if (f) f.scrollIntoView({ block: 'center' });
  S.flash = null;
}

let toastTimer = null;
function toast(msg, undo) {
  const el = $('#toast'); S.undo = undo || null;
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Desfazer</button>' : ''}`;
  el.hidden = false; const hd = document.querySelector('.top'); if (hd) el.style.top = (hd.getBoundingClientRect().bottom + 8) + 'px';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; S.undo = null; }, undo ? 9000 : 5000);
}

// ---------- telas ----------
function backupAgeDays() { return S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : null; }
function renderNotes() {
  const n = [];
  if (!tourSeen()) n.push('<div class="note"><span>Primeira vez aqui?</span><span><button data-act="help">Ver como usar</button> &nbsp; <button data-act="tour-skip">Agora não</button></span></div>');
  if (S.updated) n.push('<div class="note"><span>Nova versão pronta.</span><button data-act="reload">Atualizar agora</button></div>');
  const days = backupAgeDays();
  if (S.appts.size >= 5 && (days === null || days >= 7)) n.push(`<div class="note"><span>${days === null ? 'Você ainda não fez backup.' : `Último backup há ${days} dias.`}</span><button data-act="goto-backup">Fazer backup</button></div>`);
  return n.join('');
}

function renderAgenda() {
  const d = S.date, t = todayStr(), wk = weekOf(d), open = isOpenDay(d), day = apptsOn(d);
  const nowMin = d === t ? nowMinutes() : null;
  const chips = wk.map(s => {
    const n = apptsOn(s).length, o = isOpenDay(s), dt = fromStr(s);
    return `<button class="dchip${s === d ? ' sel' : ''}${s === t ? ' today' : ''}${o ? '' : ' closed'}" data-act="day" data-date="${s}" aria-pressed="${s === d}" aria-label="${DOW[dt.getDay()]} ${dt.getDate()}, ${o ? n + (n === 1 ? ' corte' : ' cortes') : 'fechado'}"><span class="dw">${DOW3[dt.getDay()]}</span><span class="dn">${dt.getDate()}</span><span class="dc">${o ? (n || '·') : '–'}</span></button>`;
  }).join('');
  let list = '';
  if (!open) {
    list = `<div class="closed-card">Dia sem expediente. A barbearia abre ${openDaysText()}, das ${CFG.open}h às ${CFG.close}h.</div>`;
  } else {
    let lunch = false, rows = '';
    for (const tm of SLOTS) {
      const mm = toMin(tm);
      if (!lunch && mm >= CFG.lunch[1] * 60) { lunch = true; rows += `<li class="lunch"><span>Almoço · ${CFG.lunch[0]}h às ${CFG.lunch[1]}h</span></li>`; }
      const id = idOf(d, tm), a = S.appts.get(id);
      const past = d < t || (nowMin !== null && mm + CFG.step <= nowMin);
      const isNow = nowMin !== null && mm <= nowMin && nowMin < mm + CFG.step;
      const cls = `slot ${a ? 'booked' : 'free'}${past ? ' past' : ''}${isNow ? ' now' : ''}${S.flash === id ? ' flash' : ''}`;
      const tag = isNow ? '<span class="agora">agora</span>' : '';
      rows += a
        ? `<li><button class="${cls}" data-act="appt" data-id="${esc(id)}"><span class="t">${tm}</span><span class="n">${esc(a.name)}${a.ex ? '<small>exemplo</small>' : ''}${tag}</span><span class="r">${a.tel ? I.chat : ''}</span></button></li>`
        : `<li><button class="${cls}" data-act="book" data-date="${d}" data-time="${tm}"><span class="t">${tm}</span><span class="n">Livre${tag}</span><span class="r">${I.plus}</span></button></li>`;
    }
    list = `<ul class="slots">${rows}</ul>`;
  }
  const free = SLOTS.length - day.length;
  let nextFree = '';
  if (open && d >= t) { const nf = SLOTS.find(tm => !S.appts.has(idOf(d, tm)) && (d > t || toMin(tm) >= nowMinutes())); if (nf) nextFree = ` · próximo livre <b>${nf}</b>`; }
  const summary = open ? `<p class="sum"><b>${day.length}</b> ${day.length === 1 ? 'corte' : 'cortes'} · <b>${free}</b> livres${nextFree}</p>` : '<p class="sum">Fechado</p>';
  return `${renderNotes()}${S.bookFor ? `<div class="note banner"><span>Escolha um horário livre para <b>${esc(S.bookFor.name)}</b></span><button data-act="bookfor-off">Cancelar</button></div>` : ''}
  <div class="wk">
    <button class="ib" data-act="wk" data-n="-7" aria-label="Semana anterior">${I.left}</button>
    <div class="lbl">${weekLabel(wk)}</div>
    <button class="ib" data-act="wk" data-n="7" aria-label="Próxima semana">${I.right}</button>
    <label class="ib" aria-label="Escolher uma data" style="margin:0">${I.cal}<input type="date" id="jump" value="${d}"></label>
    <button class="ib txt" data-act="today">Hoje</button>
  </div>
  <div class="days">${chips}</div>
  <h1 class="dayh">${esc(longDay(d))}</h1>${summary}${list}`;
}

function barRows(rows, tagFor) {
  return `<div class="bars">${rows.map(r => {
    const pct = r.cap ? Math.min(100, Math.round(r.n / r.cap * 100)) : 0;
    const tg = tagFor(r);
    return `<div class="brow${tg === 'low' ? ' low' : ''}"><span class="l">${esc(r.label)}</span><span class="track"><span class="fill" style="width:${pct}%"></span>${tg === 'high' ? '<span class="tag">mais cheio</span>' : tg === 'low' ? '<span class="tag">mais vazio</span>' : ''}</span><span class="v">${r.n}/${r.cap}</span></div>`;
  }).join('')}</div>`;
}
const joinPt = a => a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];

function renderPanel() {
  const dates = S.range === 'day' ? [S.date] : S.range === 'week' ? weekOf(S.date) : monthDates(S.date);
  const set = new Set(dates), openD = dates.filter(isOpenDay);
  const list = [...S.appts.values()].filter(a => set.has(a.date));
  const total = list.length, capAll = SLOTS.length * openD.length;
  const occ = capAll ? Math.round(total / capAll * 100) : 0;
  const rangeLbl = S.range === 'day' ? longDay(S.date) : S.range === 'week' ? `Semana de ${weekLabel(weekOf(S.date))}` : `${cap(MON[fromStr(S.date).getMonth()])} de ${fromStr(S.date).getFullYear()}`;
  let body = '';
  if (!openD.length) body = '<div class="empty">Dia sem expediente.</div>';
  else if (!total) body = `<div class="tiles"><div class="tile"><span class="v">0</span><span class="k">Cortes</span></div><div class="tile"><span class="v">0%</span><span class="k">Ocupação</span></div><div class="tile"><span class="v">${capAll}</span><span class="k">Livres</span></div></div><div class="empty">Nenhum corte agendado neste período. Toque em “Agenda” para marcar o primeiro.</div>`;
  else {
    const byHour = HOURS.map(h => ({ label: `${h}h`, n: list.filter(a => +a.time.slice(0, 2) === h).length, cap: slotsInHour(h) * openD.length }));
    const max = Math.max(...byHour.map(r => r.n)), min = Math.min(...byHour.map(r => r.n));
    const hi = byHour.filter(r => r.n === max), lo = byHour.filter(r => r.n === min);
    const uneven = max !== min;
    const loTxt = lo.length > 3 ? `${joinPt(lo.slice(0, 2).map(r => r.label))} e mais ${lo.length - 2}` : joinPt(lo.map(r => r.label));
    const insight = uneven
      ? `<div class="insight"><p><b>Mais cheio:</b> ${joinPt(hi.map(r => r.label))} (${max} ${max === 1 ? 'corte' : 'cortes'})</p><p><b>Mais vazio:</b> ${loTxt} (${min} ${min === 1 ? 'corte' : 'cortes'})</p></div>`
      : `<div class="insight"><p>Os horários estão equilibrados: ${max} ${max === 1 ? 'corte' : 'cortes'} em cada hora.</p></div>`;
    body = `<div class="tiles"><div class="tile"><span class="v">${total}</span><span class="k">Cortes</span></div><div class="tile"><span class="v">${occ}%</span><span class="k">Ocupação</span></div><div class="tile"><span class="v">${capAll - total}</span><span class="k">Livres</span></div></div>
    <h2 class="sec">Por horário</h2>${insight}
    ${barRows(byHour, r => uneven ? (r.n === max ? 'high' : r.n === min ? 'low' : '') : '')}
    <p class="legend">Barra cheia = todos os horários da hora ocupados (${60 / CFG.step} cortes por hora e por dia). Intervalo do almoço fora da conta.</p>`;
    if (S.range !== 'day') {
      const byDow = CFG.openDays.map(w => { const ds = dates.filter(x => dowOf(x) === w); return { label: DOW3[w].replace(/^./, c => c.toUpperCase()), n: list.filter(a => dowOf(a.date) === w).length, cap: SLOTS.length * ds.length }; }).filter(r => r.cap > 0);
      const mx = Math.max(...byDow.map(r => r.n)), mn = Math.min(...byDow.map(r => r.n));
      body += `<h2 class="sec">Por dia da semana</h2>${barRows(byDow, r => mx !== mn ? (r.n === mx ? 'high' : r.n === mn ? 'low' : '') : '')}`;
    }
  }
  let extra = '';
  if (S.range === 'day' && isOpenDay(S.date)) {
    const t = todayStr();
    const fr = SLOTS.filter(tm => !S.appts.has(idOf(S.date, tm)) && (S.date !== t || toMin(tm) >= nowMinutes())).slice(0, 8);
    if (fr.length) extra = `<h2 class="sec">Próximos horários livres</h2><div class="chips">${fr.map(tm => `<button class="chip" data-act="book" data-date="${S.date}" data-time="${tm}">${tm}</button>`).join('')}</div>`;
  }
  return `${renderNotes()}
  <div class="seg" role="group" aria-label="Período">
    ${[['day', 'Dia'], ['week', 'Semana'], ['month', 'Mês']].map(([k, l]) => `<button data-act="range" data-range="${k}" aria-pressed="${S.range === k}">${l}</button>`).join('')}
  </div>
  <p class="eyebrow" style="margin-bottom:2px">${esc(rangeLbl)}</p>
  ${body}${extra}${backupHtml()}`;
}

function setHint(msg) { const h = $('#hint'); if (h) h.textContent = msg || ''; }
function updateMics() {
  const on = S.dictState === 'listening' || S.dictState === 'starting';
  document.querySelectorAll('.mic').forEach(b => { const t = b.dataset.target === S.dictTarget; b.classList.toggle('on', on && t); b.setAttribute('aria-pressed', String(on && t)); });
  $('#fab').classList.toggle('on', on && S.dictTarget === 'cmd');
}
function micError(e) {
  const c = e && e.code;
  if (c === 'not_granted') setHint('O microfone não foi liberado. Use o microfone do teclado do celular.');
  else if (c === 'unavailable') { S.dict = null; document.documentElement.classList.add('nodict'); setHint('Voz indisponível aqui. Use o microfone do teclado do celular.'); }
  else if (c === 'rate_limited') setHint('Muitas tentativas. Espere um instante e toque de novo.');
  else if (c === 'upstream_error') setHint('Não consegui ouvir (a voz precisa de internet). Digite ou toque no microfone de novo.');
}
function startDict(target) {
  const d = S.dict; if (!d) return;
  if (S.dictState !== 'idle') { d.stop().catch(() => {}); return; }
  S.dictTarget = target; setHint('');
  if (target === 'cmd') { const c = $('#cmd'); if (c) c.value = ''; const r = $('#cmd-result'); if (r) r.innerHTML = ''; S.pending = null; }
  d.start({ language: 'pt-BR' }).catch(micError);
}
// Voz pelo reconhecimento do próprio Chrome (precisa de internet na hora de falar).
function makeDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  let rec = null, onP = () => {}, onF = () => {}, onS = () => {}, state = 'idle', why = 'stopped';
  const setState = (s, reason) => { state = s; onS({ state: s, reason }); };
  return {
    onPartial: f => { onP = f; }, onFinal: f => { onF = f; }, onState: f => { onS = f; },
    async start() {
      if (state !== 'idle') return;
      rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
      why = 'stopped';
      rec.onstart = () => setState('listening');
      rec.onresult = ev => {
        let interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) onF({ text: r[0].transcript }); else interim += r[0].transcript;
        }
        if (interim) onP({ text: interim });
      };
      rec.onerror = ev => {
        const c = ev && ev.error;
        why = (c === 'not-allowed' || c === 'service-not-allowed') ? 'not_granted' : c === 'network' ? 'upstream_error' : 'stopped';
      };
      rec.onend = () => { rec = null; setState('idle', why); };
      setState('starting');
      try { rec.start(); } catch (e) { rec = null; setState('idle', 'upstream_error'); }
    },
    async stop() { if (rec) { why = 'viewer_stopped'; try { rec.stop(); } catch (e) { /* já parou */ } } }
  };
}
function wireDict(d) {
  d.onPartial(({ text }) => { const el = $('#live'); if (el) el.textContent = text; });
  d.onFinal(({ text }) => {
    const t = S.dictTarget && document.getElementById(S.dictTarget); if (!t) return;
    t.value += t.value ? text : text.trimStart();
    if (S.dictTarget === 'f-name') { renderSugg(t.value); resetDup(); }
    const el = $('#live'); if (el) el.textContent = '';
  });
  d.onState(({ state, reason }) => {
    S.dictState = state; updateMics();
    if (state === 'idle') {
      const el = $('#live'); if (el) el.textContent = '';
      if (reason === 'not_granted' || reason === 'unavailable' || reason === 'upstream_error' || reason === 'rate_limited') micError({ code: reason });
      const c = $('#cmd');
      if (c && S.dictTarget === 'cmd' && (reason === 'stopped' || reason === 'viewer_stopped') && c.value.trim()) runCmd();
    }
  });
}

// ---------- backup e restauração ----------
const OKDATE = /^\d{4}-\d{2}-\d{2}$/, OKTIME = /^\d{2}:\d{2}$/;
function backupBlob() {
  const data = { app: 'copa-rio-agenda', schema: 1, version: APP_VERSION, exportedAt: new Date().toISOString(), appts: [...S.appts.values()], contacts: [...S.contacts.values()] };
  return { blob: new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }), name: `backup-copa-rio-${todayStr()}.json` };
}
function markBackup() { S.lastBackup = Date.now(); try { localStorage.setItem(LS_B, String(S.lastBackup)); } catch (e) { /* sem armazenamento */ } render(); }
function downloadBackup() {
  const { blob, name } = backupBlob(), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  markBackup(); toast('Backup baixado. Guarde o arquivo em um lugar seguro.');
}
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'a.json', { type: 'application/json' })] })); } catch (e) { return false; }
}
async function shareBackup() {
  const { blob, name } = backupBlob(), file = new File([blob], name, { type: 'application/json' });
  try { await navigator.share({ files: [file], title: 'Backup da agenda Copa Rio' }); markBackup(); toast('Backup enviado.'); }
  catch (e) { if (!e || e.name !== 'AbortError') toast('Não consegui compartilhar. Use "Baixar backup".'); }
}
function backupHtml() {
  const last = S.lastBackup ? fmtSave(S.lastBackup) : 'nunca';
  return `<h2 class="sec" id="backup">Cópia de segurança</h2>
  <p class="hint" style="margin-bottom:10px">Último backup: <b>${esc(last)}</b>. O arquivo guarda todos os agendamentos e clientes. Mande para o seu WhatsApp, e-mail ou Google Drive.</p>
  <div class="stack">
    <button class="btn primary" data-act="backup-down">Baixar backup</button>
    ${canShareFiles() ? '<button class="btn" data-act="backup-share">Enviar backup (WhatsApp, Drive…)</button>' : ''}
    <button class="btn" data-act="restore-pick">Restaurar de um backup</button>
    <input type="file" id="restore-file" accept=".json,application/json" hidden>
  </div>
  <p class="legend">${S.persisted ? 'Armazenamento protegido pelo navegador.' : 'Armazenamento comum: se faltar espaço no celular, o navegador pode apagar. Faça backup com frequência.'} Versão ${esc(APP_VERSION)}.</p>`;
}
// Aceita só o que parece um agendamento ou cliente de verdade; o resto é ignorado.
function cleanBackup(d) {
  const appts = [], contacts = [];
  for (const a of d.appts) {
    if (!a || typeof a.name !== 'string' || !OKDATE.test(a.date) || !OKTIME.test(a.time)) continue;
    const name = a.name.trim().slice(0, 80); if (!name) continue;
    const r = { id: idOf(a.date, a.time), name, date: a.date, time: a.time };
    if (typeof a.tel === 'string' && a.tel) r.tel = a.tel.slice(0, 30);
    appts.push(r);
  }
  for (const c of d.contacts) {
    if (!c || typeof c.name !== 'string' || !c.name.trim()) continue;
    const name = c.name.trim().slice(0, 80);
    const r = { id: typeof c.id === 'string' && /^[\w.~:@+-]{1,200}$/.test(c.id) ? c.id : slugId(name), name, tel: typeof c.tel === 'string' ? c.tel.slice(0, 30) : '' };
    if (c.hidden === true) r.hidden = true;
    contacts.push(r);
  }
  return { appts, contacts };
}
async function restoreData(c) {
  const ap = new Map(c.appts.map(a => [a.id, a])), ct = new Map(c.contacts.map(x => [x.id, x]));
  const pa = S.appts, pc = S.contacts;
  S.appts = ap; S.contacts = ct;
  try { saveLocal(); saveLocalC(); } catch (e) { S.appts = pa; S.contacts = pc; throw e; }
  render();
}
function restoreSheet(c, exportedAt) {
  const na = new Set(c.appts.map(a => a.id)).size, nc = c.contacts.length;
  const ts = exportedAt ? Date.parse(exportedAt) : NaN, when = Number.isNaN(ts) ? 'data desconhecida' : fmtSave(ts);
  openSheet(`${sheetHead('Restaurar backup', 'Confirmar')}<div class="stack">
    <div class="msg">Backup de <b>${esc(when)}</b>: <b>${na}</b> ${na === 1 ? 'agendamento' : 'agendamentos'} e <b>${nc}</b> ${nc === 1 ? 'cliente' : 'clientes'}.</div>
    <p class="hint">Isso <b>substitui</b> o que está no aparelho agora (${S.appts.size} agendamentos e ${S.contacts.size} clientes). Logo depois dá para desfazer.</p>
    <button class="btn primary" data-act="do-restore">Substituir tudo</button><button class="btn" data-act="close">Cancelar</button></div>`, 'Restaurar backup');
}
async function onRestoreFile(file) {
  if (!file) return;
  try {
    if (file.size > 5e6) throw new Error('Arquivo grande demais para ser um backup.');
    const d = JSON.parse(await file.text());
    if (!d || d.app !== 'copa-rio-agenda' || !Array.isArray(d.appts) || !Array.isArray(d.contacts)) throw new Error('Esse arquivo não é um backup da agenda.');
    S.pendingRestore = cleanBackup(d); restoreSheet(S.pendingRestore, d.exportedAt);
  } catch (e) { toast(e instanceof SyntaxError ? 'Esse arquivo não é um backup da agenda.' : (e.message || 'Não consegui ler o arquivo.')); }
  finally { const i = $('#restore-file'); if (i) i.value = ''; }
}
function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) { S.updated = true; render(); } });
    });
  }).catch(() => { /* sem instalação offline */ });
}

// ---------- eventos ----------
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, ds = b.dataset;
  switch (act) {
    case 'tab': S.tab = ds.tab; render(); window.scrollTo(0, 0); break;
    case 'day': S.date = ds.date; render(); break;
    case 'wk': S.date = addDays(S.date, +ds.n); render(); break;
    case 'today': S.date = todayStr(); firstScroll = true; render(); break;
    case 'range': S.range = ds.range; render(); break;
    case 'book': if (S.readOnly) { toast('Somente leitura. Peça acesso de edição.'); break; } { const pre = S.bookFor; S.bookFor = null; bookSheet(ds.date, ds.time, pre); } break;
    case 'appt': { const a = S.appts.get(ds.id); if (a) apptSheet(a, false); break; }
    case 'ask-cancel': { const a = S.appts.get(ds.id); if (a) apptSheet(a, true); break; }
    case 'move-open': { const a = S.appts.get(ds.id); if (a) moveSheet(a, a.date); break; }
    case 'contact': contactSheet(ds.key); break;
    case 'new-contact': if (S.readOnly) { toast('Somente leitura. Peça acesso de edição.'); break; } contactSheet(null); break;
    case 'ask-del-contact': contactSheet(ds.key, true); break;
    case 'del-contact': {
      const c = allContacts().find(x => x.key === ds.key); if (!c) break;
      const r = await run(async () => {
        // Com horários na agenda, o contato fica marcado como apagado para não reaparecer pelo nome.
        const has = [...S.appts.values()].some(a => nkey(a.name) === c.key);
        if (has) await store.putContact({ id: c.id, name: c.name, tel: '', ex: c.ex, hidden: true });
        else if (c.saved) await store.removeContact(c.id);
        return { msg: null };
      });
      if (r) { closeSheet(); render(); toast('Contato apagado.'); } break;
    }
    case 'contact-book': {
      const c = allContacts().find(x => x.key === ds.key); if (!c) break;
      S.bookFor = { name: c.name, tel: c.tel }; closeSheet(); S.tab = 'agenda'; render(); window.scrollTo(0, 0); break;
    }
    case 'bookfor-off': S.bookFor = null; render(); break;
    case 'pick-contact': {
      const c = allContacts().find(x => x.key === ds.key); if (!c) break;
      $('#f-name').value = c.name; if (c.tel) $('#f-tel').value = c.tel;
      $('#sugg').innerHTML = ''; $('#sugg-h').hidden = true;
      resetDup(); const sb = $('#save-book'); if (sb) sb.focus(); break;
    }
    case 'save-contact': {
      const name = titleCase(($('#c-name').value || '').trim().replace(/\s+/g, ' '));
      if (!name) { setHint('Digite o nome do cliente.'); $('#c-name').focus(); break; }
      const tel = ($('#c-tel').value || '').trim(), nk = nkey(name);
      const old = ds.key ? allContacts().find(x => x.key === ds.key) : null;
      if (allContacts().some(x => x.key === nk && (!old || x.key !== old.key))) { setHint('Já existe um cliente com esse nome. Use o sobrenome para diferenciar.'); break; }
      const r = await run(async () => {
        const id = old && old.saved ? old.id : slugId(name);
        await store.putContact({ id, name, tel, ex: old ? old.ex : false });
        if (old) for (const a of [...S.appts.values()]) if (nkey(a.name) === old.key && (a.name !== name || (a.tel || '') !== tel)) await store.put({ ...a, name, tel });
        return { msg: null };
      });
      if (r) { closeSheet(); render(); toast('Cliente salvo.'); } break;
    }
    case 'backup-down': downloadBackup(); break;
    case 'backup-share': shareBackup(); break;
    case 'restore-pick': { const i = $('#restore-file'); if (i) i.click(); break; }
    case 'do-restore': {
      const c = S.pendingRestore; if (!c) break;
      const snap = { appts: [...S.appts.values()], contacts: [...S.contacts.values()] };
      const r = await run(async () => { await restoreData(c); return { msg: null }; });
      if (r) { S.pendingRestore = null; closeSheet(); render(); toast('Backup restaurado.', () => restoreData(snap)); }
      break;
    }
    case 'goto-backup': S.tab = 'painel'; render(); { const el = $('#backup'); if (el) el.scrollIntoView(); } break;
    case 'reload': location.reload(); break;
    case 'help': helpSheet(); break;
    case 'tour-skip': markTour(); render(); break;
    case 'close': closeSheet(); break;
    case 'mic': startDict(ds.target); break;
    case 'cmd': {
      cmdSheet();
      if (S.dict && S.dictState === 'idle') { S.dictTarget = 'cmd'; S.dict.start({ language: 'pt-BR' }).catch(micError); }
      else { const t = $('#cmd'); if (t) t.focus(); }
      break;
    }
    case 'run-cmd': runCmd(); break;
    case 'edit-cmd': { const t = $('#cmd'); if (t) t.focus(); $('#cmd-result').innerHTML = ''; S.pending = null; break; }
    case 'pick': { const o = S.choices[+ds.i]; if (o) { const res = resolve(o.intent, ctx); if (res.type === 'run-now') { const r = await run(res.exec); if (r) { closeSheet(); after(r); } } else showResult(res); } break; }
    case 'confirm-cmd': { const res = S.pending; if (!res) break; const r = await run(res.exec); if (r) { closeSheet(); after(r); } break; }
    case 'save-book': {
      const name = titleCase(($('#f-name').value || '').trim().replace(/\s+/g, ' '));
      if (!name) { setHint('Digite o nome do cliente.'); $('#f-name').focus(); break; }
      const tel = ($('#f-tel').value || '').trim();
      const dups = dupAppts(name);
      if (dups.length && b.dataset.ok !== name) {
        const box = $('#dupmsg'); box.hidden = false; box.innerHTML = `<b>Atenção:</b> ${esc(dupText(name, dups))}`;
        b.textContent = 'Agendar mesmo assim'; b.dataset.ok = name; break;
      }
      const r = await run(() => ctx.doCreate({ name, date: ds.date, time: ds.time, tel })); if (r) { closeSheet(); after(r); } break;
    }
    case 'do-cancel': { const a = S.appts.get(ds.id); if (!a) break; const r = await run(() => ctx.doCancel(a)); if (r) { closeSheet(); after(r); } break; }
    case 'do-move': { const a = S.appts.get(ds.id); if (!a) break; const r = await run(() => ctx.doMove(a, ds.date, ds.time)); if (r) { closeSheet(); after(r); } break; }
    case 'undo': { const u = S.undo; $('#toast').hidden = true; S.undo = null; if (u) { const r = await run(async () => { await u(); return { msg: null }; }); if (r) { render(); toast('Desfeito.'); } } break; }
    case 'del-examples': {
      const ex = [...S.appts.values()].filter(a => a.ex), exc = [...S.contacts.values()].filter(c => c.ex);
      const r = await run(async () => { for (const a of ex) await store.remove(a.id); for (const c of exc) await store.removeContact(c.id); return { msg: null }; });
      if (r) toast('Exemplos apagados.'); break;
    }
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'restore-file') onRestoreFile(ev.target.files && ev.target.files[0]);
  if (ev.target.id === 'jump' && ev.target.value) { S.date = ev.target.value; render(); }
  if (ev.target.id === 'm-date' && ev.target.value) { const a = S.appts.get(ev.target.dataset.id); if (a) moveSheet(a, ev.target.value); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#sheet-root').firstChild) closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'f-name') { ev.preventDefault(); const b = document.querySelector('[data-act="save-book"]'); if (b) b.click(); }
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'cmd') { ev.preventDefault(); runCmd(); }
});

document.addEventListener('input', ev => {
  const id = ev.target.id;
  if (id === 'cq') { S.cq = ev.target.value; const l = $('#clist'); if (l) l.innerHTML = contactListHtml().html; }
  if (id === 'f-name') { renderSugg(ev.target.value); resetDup(); }
});

// ---------- início ----------
async function init() {
  S.mode = 'local'; loadLocal();
  try { S.lastSave = +localStorage.getItem(LS_L) || null; S.lastBackup = +localStorage.getItem(LS_B) || null; } catch (e) { /* sem armazenamento */ }
  S.dict = makeDictation(); if (S.dict) wireDict(S.dict);
  render();
  try { if (navigator.storage && navigator.storage.persist) { S.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist()); render(); } } catch (e) { /* segue sem proteção extra */ }
  registerSW();
}
init();
setInterval(() => { if (!document.hidden && S.tab === 'agenda' && S.date === todayStr()) render(); }, 60000);
})();
</script>
